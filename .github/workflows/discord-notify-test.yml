name: Discord Notification Tests

on:
  pull_request:
    paths:
      - '.github/scripts/discord_notify.py'
      - '.github/scripts/test_discord_notify.py'
      - '.github/workflows/discord-*.yml'
      - '.github/workflows/pr-review-signal.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/discord_notify.py'
      - '.github/scripts/test_discord_notify.py'
      - '.github/workflows/discord-*.yml'
      - '.github/workflows/pr-review-signal.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read proposed notification code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Run offline notification tests
        # No real token, webhook or personal IDs are passed to this PR job.
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
