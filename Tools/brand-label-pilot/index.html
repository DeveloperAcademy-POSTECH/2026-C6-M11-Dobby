<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>브랜드 라벨 분리 테스트 · Dobby</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{font:16px/1.6 system-ui,sans-serif;background:#f5f5f3;color:#202423;margin:0}main{max-width:1100px;margin:auto;padding:40px 24px}h1{font-size:28px;margin-bottom:8px}p{color:#5d6561}button,.picker{font:inherit;background:#174e3e;color:white;padding:12px 20px;border:0;border-radius:10px;cursor:pointer;display:inline-block}button:disabled{opacity:.5;cursor:wait}.picker{background:white;color:#174e3e;border:1px solid #b7c8bf}input{display:none}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}.card{background:white;padding:16px;border-radius:16px;border:1px solid #e0e5e1;overflow:hidden}.card img,.card canvas{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:auto}.card small{display:block;color:#5d6561;margin-top:10px}pre{white-space:pre-wrap;word-break:break-word;font:15px/1.6 system-ui}.brand{font-size:30px;font-weight:700;color:#174e3e}.error{color:#b33e23}#status{min-height:28px}h2{font-size:20px;margin-top:32px}.badge{font-size:13px;padding:4px 10px;background:#e7eee9;border-radius:20px;color:#174e3e}
#preview{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}#preview img{height:150px}
</style>
<main>
<span class="badge">Dobby · 브랜드 판독 실험</span>
<h1>라벨을 따로 보고, 브랜드를 읽기</h1>
<p>① 라벨 위치 찾기 → ② 영역 크롭·회전 OCR → ③ 원문·브랜드 판독<br>같은 옷의 사진을 최대 5장 선택하세요. 실제 AI를 호출하며, 판독 결과는 앱 상품에 저장되지 않아요.</p>
<div class="actions"><label class="picker">사진 선택<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="run" disabled>라벨 분리 판독</button><button id="download" hidden>결과 JSON 저장</button></div>
<p id="status" role="status" aria-live="polite">사진을 선택해 주세요.</p>
<div id="preview" class="grid"></div><section id="result" hidden><h2>판독한 브랜드</h2><div id="brand" class="brand"></div><p id="timing"></p><h2>크롭 영역과 원문</h2><div id="crops" class="grid"></div><h2>원본에서 찾은 라벨 위치</h2><div id="originals" class="grid"></div></section>
</main>
<script>
const nonce='__PILOT_NONCE__';let photos=[],lastResult=null,busy=false;
const $=id=>document.getElementById(id);
function setStatus(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function image(src){const img=new Image();img.src=src;return img;}
function card(){const el=document.createElement('div');el.className='card';return el;}
function caption(el,text){const small=document.createElement('small');small.textContent=text;el.append(small);}
function clearResult(){lastResult=null;$('result').hidden=true;$('download').hidden=true;}
async function encode(file,index){
 const bitmap=await createImageBitmap(file);const scale=Math.min(1,2048/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return {id:`photo-${index+1}`,role:'detail',imageDataUrl:canvas.toDataURL('image/jpeg',.8)};
}
$('files').onchange=async e=>{if(busy)return;clearResult();photos=[];$('preview').replaceChildren();$('run').disabled=true;const files=Array.from(e.target.files);if(!files.length)return;if(files.length>5){setStatus('최대 5장까지 선택해 주세요.',true);return;}try{photos=await Promise.all(files.map(encode));for(const p of photos){const el=card();el.append(image(p.imageDataUrl));caption(el,p.id);$('preview').append(el);}$('run').disabled=false;setStatus(`${photos.length}장 준비됨 · 버튼을 누르면 실제 AI 판독을 시작해요.`);}catch{setStatus('사진을 읽지 못했습니다. JPG·PNG·WebP로 다시 선택해 주세요.',true);}};
$('run').onclick=async()=>{if(busy||!photos.length)return;clearResult();busy=true;$('run').disabled=true;$('files').disabled=true;const start=Date.now();setStatus('라벨 위치를 찾고 크롭을 판독하고 있어요…');const timer=setInterval(()=>setStatus(`라벨 위치 찾기·크롭 판독 중… ${Math.floor((Date.now()-start)/1000)}초`),1000);try{const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json','X-Pilot-Nonce':nonce},body:JSON.stringify({photos})});const data=await r.json();if(!r.ok)throw new Error(data.error||'판독에 실패했습니다.');await render(data);lastResult=data;$('download').hidden=false;clearInterval(timer);setStatus(data.status==='read_failed'?data.readError:data.status==='no_label_region'?'라벨 영역을 찾지 못했습니다. 라벨 근접 사진으로 확인해 주세요.':'판독 완료 · 크롭 위치와 원문이 맞는지 확인해 주세요.');}catch(e){clearInterval(timer);setStatus(e.message||'연결에 실패했습니다.',true);}finally{clearInterval(timer);busy=false;$('run').disabled=false;$('files').disabled=false;}};
async function render(data){$('result').hidden=false;$('brand').textContent=data.brand?`${data.brand.originalName}${data.brand.localizedName?' · '+data.brand.localizedName:''}`:'확정하지 못함';$('timing').textContent=`위치 찾기 ${data.timing.locateSeconds}초 · 크롭·OCR ${data.timing.cropOCRSeconds??0}초 · 크롭 판독 ${data.timing.readSeconds}초 · 전체 ${data.timing.totalSeconds}초`;$('crops').replaceChildren();for(const crop of data.crops){const el=card();el.append(image(crop.imageDataUrl));caption(el,`${crop.id} · 원본 ${crop.sourcePhotoId} · ${crop.kind}`);const reading=data.readings.find(r=>r.photoId===crop.id);const pre=document.createElement('pre');pre.textContent=reading?`판독: ${reading.text||'(읽지 못함)'}\n상태: ${reading.legibility}`:'판독 없음';el.append(pre);if(crop.ocr?.length){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='회전별 Apple OCR 원문';details.append(summary);const raw=document.createElement('pre');raw.textContent=crop.ocr.map(o=>`${o.rotationDegrees}° · ${o.text} (${o.confidence.toFixed(2)})`).join('\n');details.append(raw);el.append(details);}$('crops').append(el);}$('originals').replaceChildren();for(const p of data.photos){const img=image(p.imageDataUrl);await img.decode();const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);ctx.strokeStyle='#f36c33';ctx.lineWidth=Math.max(3,canvas.width/250);for(const crop of data.crops.filter(c=>c.sourcePhotoId===p.id)){const [x,y,x2,y2]=crop.pixelBox;ctx.strokeRect(x,y,x2-x,y2-y);}const el=card();el.append(canvas);caption(el,p.id+' · 주황색: 실제 크롭 범위');$('originals').append(el);}}
$('download').onclick=()=>{if(!lastResult)return;const url=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='brand-label-pilot-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
