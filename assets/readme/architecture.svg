<text x="364" y="616" font-size="20" fill="#E9EEF5" font-weight="600" text-anchor="start">구현체</text>
<text x="364" y="645" font-size="15" fill="#B9C6D6" font-weight="400" text-anchor="start">실제 구현 / 테스트 구현</text>
