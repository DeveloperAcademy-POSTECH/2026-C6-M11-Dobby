name: Discord Notifications

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  event-notification:
    if: >-
      (github.event_name != 'pull_request_review' || github.event.review.state == 'approved') &&
      (github.event_name != 'pull_request_target' || github.event.action != 'closed' ||
      github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: discord-event-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Read trusted default-branch files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Notify Discord
        run: python3 .github/scripts/discord_notify.py event
        env:
          DISCORD_ISSUE_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK_URL }}
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
          REVIEWER_LOGINS: ${{ vars.DISCORD_REVIEWER_LOGINS }}
