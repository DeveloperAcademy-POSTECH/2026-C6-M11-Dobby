name: Discord Notifications

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review, closed]
  workflow_run:
    workflows: [PR Review Signal]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  event-notification:
    if: >-
      (github.event_name != 'pull_request_target' || github.event.action != 'closed' ||
      github.event.pull_request.merged == true) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: >-
        discord-event-${{ github.event.issue.number || github.event.pull_request.number ||
        github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Read trusted default-branch files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Notify Discord about repository event
        if: github.event_name != 'workflow_run'
        run: python3 .github/scripts/discord_notify.py event
        env:
          DISCORD_ISSUE_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK_URL }}
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
          REVIEWER_LOGINS: ${{ vars.DISCORD_REVIEWER_LOGINS }}
      - name: Notify Discord about approved pull request
        if: github.event_name == 'workflow_run'
        run: python3 .github/scripts/discord_notify.py approval
        env:
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
