<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
<title id="title">chak 아키텍처 — MV 패턴, 작업 실행, 의존성 주입, 저장</title>
<desc id="desc">View와 Model은 조회와 변경으로 연결됩니다. View는 Workflow와 Session에 작업을 요청하고 Store와 Archive에 저장과 복원을 요청합니다. Workflow와 Session은 Protocol을 호출하며 실제 또는 테스트 구현체가 이 프로토콜을 구현합니다. Store와 Archive는 SwiftData와 파일을 사용합니다. 실선은 호출과 데이터 접근, 점선은 프로토콜 구현 관계입니다.</desc>
<defs>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#DC9B78" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#91ABC8" stroke-width="1.5"/></marker>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8FB8AC" stroke-width="1.5"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#91ABC8" stroke-width="1.5"/></marker>
</defs>
